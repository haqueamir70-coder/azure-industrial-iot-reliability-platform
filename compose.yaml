services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_PATH: /data/alerts.db
      TEMP_WARNING_C: "80"
      TEMP_CRITICAL_C: "95"
    volumes:
      - alert-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
volumes:
  alert-data:
