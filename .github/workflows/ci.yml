name: Repository validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  documentation:
    name: Documentation and repository checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required documentation
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s architecture/README.md
          test -s docs/telemetry-contract.md
          test -s docs/security-model.md
          test -s interview-prep/README.md
          echo "Required project documentation is present."

      - name: Check for accidental secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
