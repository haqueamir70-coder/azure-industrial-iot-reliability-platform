name: Industrial IoT CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation-and-secrets:
    name: Documentation and secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check required documentation
        run: |
          test -s README.md
          test -s architecture/README.md
          test -s docs/telemetry-contract.md
          test -s docs/security-model.md
          test -s interview-prep/README.md
          echo "Required documentation is present."
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python-quality:
    name: Simulator and API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Compile Python
        run: python -m compileall -q src tests
      - name: Install application and development dependencies
        run: pip install -e ".[dev]"
      - name: Run simulator unit tests
        run: python -m unittest discover -s tests -v
      - name: Run API and rules tests
        run: pytest -q
      - name: Ruff lint
        run: ruff check src tests --select F
      - name: Bandit security scan
        run: bandit -q -r src/iot_reliability

  terraform-validation:
    name: Terraform validation and IaC scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform format
        run: terraform fmt -check -recursive
      - name: Terraform init
        run: terraform init -backend=false
      - name: Terraform validate
        run: terraform validate
      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/terraform
          framework: terraform
          soft_fail: true
